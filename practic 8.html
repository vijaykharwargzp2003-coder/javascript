<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTMLlevel 3</title>
</head>
<body>
    <form Action="https://www.google.com/search?">
        <input type="text" name="q" placeholder="search in google"/>
        <button>search</button>
    </form>
    <hr>
    <form Action="/server">
        <input type="checkbox"id="age"name="age"checked/>
        <label for="age">i am 18+</label>
        <div>
            <input type="radio" name="fruit" id="apple" value="apple"/>
            <label for="apple">Apple</label>
            <input type="radio" name="fruit" id="mango" value="mango"/>
            <label for="mango">Mango</label>
            <input type="radio" name="fruit" id="banana" value="banana"/>
            <label for="banana">Banana</label>

        </div>
        <button>submit</button>
        <div>
            choose your profession
            <select name="profession" id="profession">
                <option>select your option</option>
                <option value="student"selected>student</option>
                 <option value="dev">developer</option>
            </select>
        </div>
        <label for="vol">select your volume level:</label>
        <input type="range"min="o"max="100"name="vol"step="10" value="70"/>
        <br>
        
        <label for="feedback">please provide  your valuable feedback:</label>
        <textarea id="feedback"name="feedback"  placeholder="write your feedback here"></textarea>
        <button>submit</button>



    </form>
</body>
</html>
